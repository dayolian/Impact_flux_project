<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mars Crater Validation</title>
  <style>
    /* ── Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111318;
      color: #d0d4dc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    #header {
      background: #1a1e28;
      border-bottom: 1px solid #2a2f3d;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }

    #header .title {
      font-weight: 700;
      font-size: 14px;
      color: #e8ecf4;
      white-space: nowrap;
    }

    #header .pair-name {
      font-family: monospace;
      font-size: 11px;
      color: #7a8aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    #header .stats {
      display: flex;
      gap: 16px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #header .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #header .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: #e8ecf4;
    }

    #header .stat-lbl {
      font-size: 10px;
      color: #556070;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #progress-bar-wrap {
      width: 140px;
      flex-shrink: 0;
    }

    #progress-bar-bg {
      background: #2a2f3d;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    #progress-bar-fill {
      height: 100%;
      background: #4a7eff;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    #progress-label {
      font-size: 10px;
      color: #556070;
      margin-top: 2px;
      text-align: right;
    }

    /* ── Grid ───────────────────────────────────────────────────── */
    #grid-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 4px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    /* ── Cell ───────────────────────────────────────────────────── */
    .cell {
      background: #1a1e28;
      border: 2px solid #2a2f3d;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s;
    }

    .cell.confirmed_hit  { border-color: #3dba5c; background: #141e18; }
    .cell.potential_hit  { border-color: #e0921a; background: #1e1810; }
    .cell.interesting    { border-color: #3a88e0; background: #101620; }

    .cell img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;  /* keep Mars craters crisp, not blurry */
      background: #000;
    }

    .hit-info {
      font-family: monospace;
      font-size: 10px;
      color: #556070;
      text-align: center;
    }

    .hit-info .are-val {
      font-size: 12px;
      font-weight: 700;
      color: #a0aab8;
    }

    /* ── Label buttons ──────────────────────────────────────────── */
    .hit-buttons {
      display: flex;
      gap: 3px;
      width: 100%;
    }

    .lbl-btn {
      flex: 1;
      padding: 3px 2px;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: #23283a;
      color: #7a8aaa;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .lbl-btn:hover { filter: brightness(1.2); }

    .lbl-btn.confirmed_hit         { border-color: #2a4030; }
    .lbl-btn.confirmed_hit.active  { background: #3dba5c; color: #fff; border-color: #3dba5c; }

    .lbl-btn.potential_hit         { border-color: #3a2c10; }
    .lbl-btn.potential_hit.active  { background: #e0921a; color: #fff; border-color: #e0921a; }

    .lbl-btn.interesting           { border-color: #162a40; }
    .lbl-btn.interesting.active    { background: #3a88e0; color: #fff; border-color: #3a88e0; }

    /* ── Footer ─────────────────────────────────────────────────── */
    #footer {
      background: #1a1e28;
      border-top: 1px solid #2a2f3d;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    #footer .legend {
      display: flex;
      gap: 12px;
      flex: 1;
      font-size: 11px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .legend-dot.confirmed_hit { background: #3dba5c; }
    .legend-dot.potential_hit { background: #e0921a; }
    .legend-dot.interesting   { background: #3a88e0; }

    .nav-btn {
      padding: 7px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: filter 0.12s;
    }

    .nav-btn:hover { filter: brightness(1.15); }
    .nav-btn:disabled { opacity: 0.4; cursor: default; filter: none; }

    #btn-next-page { background: #2a3550; color: #c0ccee; }
    #btn-next-pair { background: #1e5c30; color: #c0f0d0; }

    .kbd {
      display: inline-block;
      background: #2a2f3d;
      border: 1px solid #3a3f50;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 10px;
      color: #7a8aaa;
    }

    /* ── Done screen ─────────────────────────────────────────────── */
    #done-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #done-screen.visible { display: flex; }

    #done-screen h1 { font-size: 32px; color: #3dba5c; }
    #done-screen p  { color: #7a8aaa; }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="title">Mars Crater Validation</div>
  <div id="pair-name" class="pair-name">—</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="stat-pair">—</div>
      <div class="stat-lbl">Pair</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-page">—</div>
      <div class="stat-lbl">Page</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-hits">—</div>
      <div class="stat-lbl">Hits</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-reg">—</div>
      <div class="stat-lbl">RegScore</div>
    </div>
  </div>
  <div id="progress-bar-wrap">
    <div id="progress-bar-bg"><div id="progress-bar-fill" style="width:0%"></div></div>
    <div id="progress-label">0 / 0 done</div>
  </div>
</div>

<!-- Grid -->
<div id="grid-wrap">
  <div id="grid"></div>
  <div id="done-screen">
    <h1>All done!</h1>
    <p>Every pair has been reviewed. Results saved to the output folder.</p>
  </div>
</div>

<!-- Footer -->
<div id="footer">
  <div class="legend">
    <span><span class="legend-dot confirmed_hit"></span>Confirmed hit</span>
    <span><span class="legend-dot potential_hit"></span>Potential hit</span>
    <span><span class="legend-dot interesting"></span>Interesting</span>
    <span style="color:#556070; margin-left:8px;">
      Keyboard: <span class="kbd">→</span> or <span class="kbd">Space</span> to advance
    </span>
  </div>
  <button id="btn-next-page" class="nav-btn">Next page &rarr;</button>
  <button id="btn-next-pair" class="nav-btn">Done with pair &#10003;</button>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let appState = null;   // last /api/state response
  let showBefore = true; // blink phase

  // ── Blink timer ────────────────────────────────────────────────────────────
  setInterval(() => {
    showBefore = !showBefore;
    document.querySelectorAll(".hit-img").forEach(img => {
      img.src = showBefore ? img.dataset.before : img.dataset.after;
    });
  }, 500);

  // ── API helpers ────────────────────────────────────────────────────────────
  async function apiGet(url) {
    const r = await fetch(url);
    return r.json();
  }

  async function apiPost(url) {
    const r = await fetch(url, { method: "POST" });
    return r.json();
  }

  async function apiPostJson(url, body) {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    return r.json();
  }

  // ── Load & render ──────────────────────────────────────────────────────────
  async function loadState() {
    appState = await apiGet("/api/state");
    render();
  }

  function render() {
    const s = appState;
    const gridWrap  = document.getElementById("grid-wrap");
    const grid      = document.getElementById("grid");
    const doneScr   = document.getElementById("done-screen");
    const footer    = document.getElementById("footer");

    if (s.done) {
      grid.innerHTML = "";
      grid.style.display = "none";
      doneScr.classList.add("visible");
      footer.style.display = "none";
      return;
    }

    grid.style.display = "";
    doneScr.classList.remove("visible");
    footer.style.display = "";

    // Header stats
    document.getElementById("pair-name").textContent = s.pair_name;
    document.getElementById("stat-pair").textContent =
      `${s.pair_idx + 1} / ${s.total_pairs}`;
    document.getElementById("stat-page").textContent =
      `${s.page + 1} / ${s.total_pages}`;
    document.getElementById("stat-hits").textContent = s.total_hits;
    document.getElementById("stat-reg").textContent  = s.reg_score;

    const pct = s.total_pairs > 0 ? (s.done_pairs / s.total_pairs) * 100 : 0;
    document.getElementById("progress-bar-fill").style.width = pct + "%";
    document.getElementById("progress-label").textContent =
      `${s.done_pairs} / ${s.total_pairs} done`;

    // Nav buttons
    const isLastPage = (s.page + 1 >= s.total_pages);
    document.getElementById("btn-next-page").style.display = isLastPage ? "none" : "";
    document.getElementById("btn-next-pair").style.display = isLastPage ? "" : "none";

    // Render hit cells
    grid.innerHTML = "";
    s.hits.forEach(hit => {
      const cell = document.createElement("div");
      cell.className = "cell" + (hit.label ? " " + hit.label : "");
      cell.id = "cell-" + hit.prefix;

      // Image
      const img = document.createElement("img");
      img.className   = "hit-img";
      img.dataset.before = hit.before_url;
      img.dataset.after  = hit.after_url;
      img.src         = showBefore ? hit.before_url : hit.after_url;
      img.alt         = hit.prefix;

      // Info
      const info = document.createElement("div");
      info.className = "hit-info";
      info.innerHTML = `<span class="are-val">ARE ${hit.ARE}</span><br>(${hit.x}, ${hit.y})`;

      // Label buttons
      const btns = document.createElement("div");
      btns.className = "hit-buttons";

      const LABELS = [
        { key: "confirmed_hit", short: "Confirmed" },
        { key: "potential_hit", short: "Potential" },
        { key: "interesting",   short: "Interesting" },
      ];

      LABELS.forEach(({ key, short }) => {
        const btn = document.createElement("button");
        btn.className = "lbl-btn " + key + (hit.label === key ? " active" : "");
        btn.textContent = short;
        btn.title = key.replace(/_/g, " ");
        btn.onclick = () => toggleLabel(hit, key);
        btns.appendChild(btn);
      });

      cell.appendChild(img);
      cell.appendChild(info);
      cell.appendChild(btns);
      grid.appendChild(cell);
    });
  }

  // ── Labeling ───────────────────────────────────────────────────────────────
  async function toggleLabel(hit, label) {
    // Clicking the active label clears it; clicking a different one sets it
    const newLabel = (hit.label === label) ? "" : label;
    await apiPostJson("/api/label", { prefix: hit.prefix, label: newLabel });
    hit.label = newLabel; // update local state without full reload
    render();
  }

  // ── Navigation ─────────────────────────────────────────────────────────────
  document.getElementById("btn-next-page").onclick = async () => {
    await apiPost("/api/next-page");
    await loadState();
  };

  document.getElementById("btn-next-pair").onclick = async () => {
    await apiPost("/api/next-pair");
    await loadState();
  };

  // Keyboard shortcuts: → and Space advance (next-page or next-pair)
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "BUTTON") return; // don't double-fire from button focus
    if (e.key === "ArrowRight" || e.key === " ") {
      e.preventDefault();
      const nextPage = document.getElementById("btn-next-page");
      const nextPair = document.getElementById("btn-next-pair");
      if (nextPage.style.display !== "none") nextPage.click();
      else if (nextPair.style.display !== "none") nextPair.click();
    }
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  loadState();
</script>
</body>
</html>
