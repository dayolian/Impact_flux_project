<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mars Crater Review — Flagged Hits</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111318;
      color: #d0d4dc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    #header {
      background: #1a1e28;
      border-bottom: 1px solid #2a2f3d;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }

    #header .title { font-weight: 700; font-size: 14px; color: #e8ecf4; }

    #header .stats {
      display: flex; gap: 20px; flex: 1;
    }

    .stat-chip {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: #7a8aaa;
    }

    .stat-chip .fraction { color: #e8ecf4; font-size: 13px; font-weight: 700; }
    .stat-chip .fraction .denom { color: #556070; font-weight: 400; }

    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.confirmed_hit { background: #3dba5c; }
    .dot.potential_hit { background: #e0921a; }
    .dot.interesting   { background: #3a88e0; }

    /* ── Grid ─────────────────────────────────────────────────────── */
    #grid-wrap {
      flex: 1; overflow-y: auto; padding: 10px 12px 4px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    /* ── Cell ─────────────────────────────────────────────────────── */
    .cell {
      background: #1a1e28;
      border: 2px solid #2a2f3d;
      border-radius: 7px;
      padding: 8px;
      display: flex;
      gap: 10px;
    }

    .cell.confirmed_hit { border-color: #3dba5c; }
    .cell.potential_hit { border-color: #e0921a; }
    .cell.interesting   { border-color: #3a88e0; }

    .cell-img {
      flex-shrink: 0;
      width: 200px;
      height: 200px;
      background: #000;
      display: block;
      image-rendering: pixelated;
      object-fit: contain;
    }

    .cell-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    /* Label badge */
    .label-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      align-self: flex-start;
    }

    .label-badge.confirmed_hit { background: #1a3d24; color: #3dba5c; }
    .label-badge.potential_hit { background: #3d2a0a; color: #e0921a; }
    .label-badge.interesting   { background: #0d2340; color: #3a88e0; }

    /* Metadata rows */
    .meta { font-size: 11px; color: #556070; line-height: 1.7; }
    .meta .val { color: #b0bcd4; font-family: monospace; }

    .pair-name {
      font-size: 10px;
      font-family: monospace;
      color: #404860;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Comment area */
    .comment-label {
      font-size: 11px;
      color: #556070;
      margin-top: auto;
      padding-top: 6px;
    }

    .comment-box {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      background: #13161f;
      border: 1px solid #2a2f3d;
      border-radius: 4px;
      color: #c8d0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      padding: 5px 7px;
      line-height: 1.5;
      transition: border-color 0.15s;
    }

    .comment-box:focus {
      outline: none;
      border-color: #4a6090;
    }

    .comment-box.saved {
      border-color: #3dba5c;
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    #footer {
      background: #1a1e28;
      border-top: 1px solid #2a2f3d;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    #footer .page-info {
      flex: 1;
      font-size: 12px;
      color: #556070;
    }

    .nav-btn {
      padding: 7px 22px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: filter 0.12s;
      background: #2a3550;
      color: #c0ccee;
    }

    .nav-btn:hover:not(:disabled) { filter: brightness(1.2); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    .kbd {
      display: inline-block;
      background: #2a2f3d;
      border: 1px solid #3a3f50;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 10px;
      color: #7a8aaa;
    }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="title">Crater Review</div>
  <div class="stats">
    <div class="stat-chip">
      <span class="dot confirmed_hit"></span>
      <span class="fraction">
        <span id="seen-confirmed">—</span><span class="denom"> / <span id="total-confirmed">—</span></span>
      </span>
      confirmed
    </div>
    <div class="stat-chip">
      <span class="dot potential_hit"></span>
      <span class="fraction">
        <span id="seen-potential">—</span><span class="denom"> / <span id="total-potential">—</span></span>
      </span>
      potential
    </div>
    <div class="stat-chip">
      <span class="dot interesting"></span>
      <span class="fraction">
        <span id="seen-interesting">—</span><span class="denom"> / <span id="total-interesting">—</span></span>
      </span>
      interesting
    </div>
  </div>
</div>

<!-- Grid -->
<div id="grid-wrap">
  <div id="grid"></div>
</div>

<!-- Footer -->
<div id="footer">
  <div class="page-info" id="page-info">Page — / —</div>
  <button id="btn-prev" class="nav-btn" disabled>&#8592; Prev</button>
  <button id="btn-next" class="nav-btn" disabled>Next &#8594;</button>
  <span style="color:#556070;font-size:11px;">
    <span class="kbd">←</span><span class="kbd">→</span> navigate &nbsp;·&nbsp;
    Comments saved automatically on blur
  </span>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let appState  = null;
  let showBefore = true;
  let saveTimers = {};  // debounce timers keyed by hit_prefix

  // ── Blink ──────────────────────────────────────────────────────────────────
  setInterval(() => {
    showBefore = !showBefore;
    document.querySelectorAll(".cell-img").forEach(img => {
      img.src = showBefore ? img.dataset.before : img.dataset.after;
    });
  }, 500);

  // ── API ────────────────────────────────────────────────────────────────────
  async function apiGet(url) {
    return (await fetch(url)).json();
  }
  async function apiPost(url, body) {
    return (await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })).json();
  }

  // ── Load & render ──────────────────────────────────────────────────────────
  async function loadState() {
    appState = await apiGet("/api/state");
    render();
  }

  function render() {
    const s = appState;

    // Per-label seen / total counts
    const ls = s.label_stats || {};
    const setCount = (seenId, totalId, lbl) => {
      const stat = ls[lbl] || { seen: "—", total: "—" };
      document.getElementById(seenId).textContent  = stat.seen;
      document.getElementById(totalId).textContent = stat.total;
    };
    setCount("seen-confirmed", "total-confirmed", "confirmed_hit");
    setCount("seen-potential",  "total-potential",  "potential_hit");
    setCount("seen-interesting","total-interesting","interesting");

    // Footer
    document.getElementById("page-info").textContent =
      `Page ${s.page + 1} / ${s.total_pages}  ·  ${s.total_hits} total flagged hits`;
    document.getElementById("btn-prev").disabled = s.page === 0;
    document.getElementById("btn-next").disabled = s.page + 1 >= s.total_pages;

    // Render cells
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    s.hits.forEach(hit => {
      const cell = document.createElement("div");
      cell.className = `cell ${hit.label}`;

      // Blinking image
      const img = document.createElement("img");
      img.className      = "cell-img";
      img.dataset.before = hit.before_url;
      img.dataset.after  = hit.after_url;
      img.src            = showBefore ? hit.before_url : hit.after_url;
      img.alt            = hit.hit_prefix;

      // Info body
      const body = document.createElement("div");
      body.className = "cell-body";

      // Label badge
      const badge = document.createElement("div");
      badge.className = `label-badge ${hit.label}`;
      badge.textContent = hit.label.replace(/_/g, " ");

      // Metadata
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML =
        `Lat <span class="val">${hit.lat}</span> &nbsp; Lon <span class="val">${hit.lon}</span><br>` +
        `ARE <span class="val">${hit.ARE}</span>`;

      // Pair name (truncated)
      const pname = document.createElement("div");
      pname.className = "pair-name";
      pname.title     = hit.pair_name;
      pname.textContent = hit.pair_name;

      // Comment
      const commentLabel = document.createElement("div");
      commentLabel.className = "comment-label";
      commentLabel.textContent = "Notes:";

      const textarea = document.createElement("textarea");
      textarea.className   = "comment-box";
      textarea.value       = hit.comments;
      textarea.placeholder = "Add notes…";
      textarea.dataset.prefix = hit.hit_prefix;

      // Save on blur (when user clicks away)
      textarea.addEventListener("blur", () => saveComment(hit.hit_prefix, textarea));

      // Visual feedback: green border briefly after save
      textarea.addEventListener("input", () => {
        textarea.classList.remove("saved");
      });

      body.appendChild(badge);
      body.appendChild(meta);
      body.appendChild(pname);
      body.appendChild(commentLabel);
      body.appendChild(textarea);

      cell.appendChild(img);
      cell.appendChild(body);
      grid.appendChild(cell);
    });
  }

  // ── Save comment ───────────────────────────────────────────────────────────
  async function saveComment(prefix, textarea) {
    const comment = textarea.value;
    await apiPost("/api/comment", { hit_prefix: prefix, comment });
    textarea.classList.add("saved");
    setTimeout(() => textarea.classList.remove("saved"), 1200);
  }

  // ── Navigation ─────────────────────────────────────────────────────────────
  async function navigate(direction) {
    // Save any focused textarea before navigating
    const focused = document.activeElement;
    if (focused && focused.classList.contains("comment-box")) {
      await saveComment(focused.dataset.prefix, focused);
      focused.blur();
    }
    await apiPost("/api/navigate", { direction });
    await loadState();
  }

  document.getElementById("btn-prev").onclick = () => navigate("prev");
  document.getElementById("btn-next").onclick = () => navigate("next");

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight") navigate("next");
    if (e.key === "ArrowLeft")  navigate("prev");
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  loadState();
</script>
</body>
</html>
